{% extends 'inventory/base.html' %}

{% block content %}

<div class="card shadow-sm p-4 mb-4">

    <div class="d-flex justify-content-between align-items-center">

        <h3>
            Material Transfer
        </h3>

        <a
            href="/materials/"
            class="btn btn-secondary"
        >
            Back
        </a>

    </div>

    <hr>

    {% if error %}

    <div class="alert alert-danger">

        {{ error }}

    </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <!-- FIRST ROW -->

        <div class="row g-4">

            <!-- FROM PROJECT -->

            <div class="col-md-3">

                <label class="form-label">

                    From Project

                </label>

                <select
                    name="from_project"
                    class="form-select"
                    required
                >

                    {% for project in projects %}

                    <option
                        value="{{ project.id }}"
                    >

                        {{ project.project_code }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <!-- TO PROJECT -->

            <div class="col-md-3">

                <label class="form-label">

                    To Project

                </label>

                <select
                    name="to_project"
                    class="form-select"
                    required
                >

                    {% for project in projects %}

                    <option
                        value="{{ project.id }}"
                    >

                        {{ project.project_code }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <!-- MATERIAL CODE -->

            <div class="col-md-6">

                <label class="form-label">

                    Material Code

                </label>

                <input
                    type="text"
                    id="materialCode"
                    class="form-control"
                    placeholder="Insert Material Code"
                    list="materialCodeList"
                    autocomplete="off"
                    style="text-align:left;"
                    required
                >

                <datalist id="materialCodeList">

                    {% for material in materials %}

                    <option
                        value="{{ material.material_code }}"
                    >

                    {% endfor %}

                </datalist>

            </div>

        </div>

        <!-- SECOND ROW -->

        <div class="row g-4 mt-1">

            <!-- MATERIAL NAME -->

            <div class="col-md-6">

                <label class="form-label">

                    Material Name

                </label>

                <input
                    type="text"
                    id="materialName"
                    class="form-control"
                    readonly
                >

            </div>

            <!-- SIZE -->

            <div class="col-md-6">

                <label class="form-label">

                    Size

                </label>

                <input
                    type="text"
                    id="materialSize"
                    class="form-control"
                    readonly
                >

            </div>

        </div>

        <!-- THIRD ROW -->

        <div class="row g-4 mt-1">

            <!-- QUANTITY -->

            <div class="col-md-4">

                <label class="form-label">

                    Quantity

                </label>

                <input
                    type="number"
                    step="0.01"
                    name="quantity"
                    class="form-control"
                    required
                >

            </div>

            <!-- UNIT -->

            <div class="col-md-2">

                <label class="form-label">

                    Unit

                </label>

                <input
                    type="text"
                    id="materialUnit"
                    class="form-control"
                    readonly
                >

            </div>

        </div>

        <!-- HIDDEN MATERIAL ID -->

        <input
            type="hidden"
            name="material"
            id="materialId"
        >

        <br>

        <button
            type="submit"
            class="btn btn-primary"
        >

            Transfer Material

        </button>

    </form>

</div>

<script>

const materials = [

    {% for material in materials %}

    {

        id: "{{ material.id }}",

        code: "{{ material.material_code|escapejs }}",

        name: "{{ material.material_name|escapejs }}",

        size: "{{ material.size|escapejs }}",

        unit: "{{ material.unit|escapejs }}"

    },

    {% endfor %}

];

document.getElementById(
    "materialCode"
).addEventListener(

    "input",

    function () {

        let enteredCode =
            this.value.trim();

        let foundMaterial =
            materials.find(

                m =>
                m.code === enteredCode

            );

        if (foundMaterial) {

            document.getElementById(
                "materialName"
            ).value = foundMaterial.name;

            document.getElementById(
                "materialSize"
            ).value = foundMaterial.size;

            document.getElementById(
                "materialUnit"
            ).value = foundMaterial.unit;

            document.getElementById(
                "materialId"
            ).value = foundMaterial.id;

        }

        else {

            document.getElementById(
                "materialName"
            ).value = "";

            document.getElementById(
                "materialSize"
            ).value = "";

            document.getElementById(
                "materialUnit"
            ).value = "";

            document.getElementById(
                "materialId"
            ).value = "";

        }

    }

);

</script>

{% endblock %}
