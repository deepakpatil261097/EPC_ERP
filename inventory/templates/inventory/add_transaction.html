{% extends 'inventory/base.html' %}

{% block content %}

<!-- PAGE HEADER -->

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>

            Stock IN / OUT

        </h2>

        <p class="text-muted mb-0">

            Add inventory stock
            movements for projects

        </p>

    </div>

</div>

<!-- MAIN CARD -->

<div class="erp-card">

    {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

    {% endif %}

    <!-- FORM -->

    <form method="POST">

        {% csrf_token %}

        <!-- ROW 1 -->

        <div class="row mb-4">

            <!-- MOVEMENT TYPE -->

            <div class="col-md-4">

                <label class="form-label">

                    Movement Type

                </label>

                <select
                    name="transaction_type"
                    class="form-select"
                    required
                >

                    <option value="">

                        Select Type

                    </option>

                    <option value="IN">

                        Stock IN

                    </option>

                    <option value="OUT">

                        Stock OUT

                    </option>

                </select>

            </div>

            <!-- PROJECT -->

            <div class="col-md-4">

                <label class="form-label">

                    Project Code

                </label>

                <select
                    name="project"
                    class="form-select"
                    required
                >

                    <option value="">

                        Select Project

                    </option>

                    {% for project in projects %}

                        <option value="{{ project.id }}">

                            {{ project.project_code }}

                        </option>

                    {% endfor %}

                </select>

            </div>

            <!-- MATERIAL -->

            <div class="col-md-4">

                <label class="form-label">

                    Material Code

                </label>

                <input
                    list="material_list"
                    id="material_code"
                    name="material"
                    class="form-control"
                    placeholder="Insert Material Code"
                    required
                >

                <datalist id="material_list">

                    {% for material in materials %}

                        <option
                            value="{{ material.material_code }}"
                            data-name="{{ material.material_name }}"
                            data-size="{{ material.size }}"
                            data-unit="{{ material.unit }}"
                        >

                        </option>

                    {% endfor %}

                </datalist>

            </div>

        </div>

        <!-- ROW 2 -->

        <div class="row mb-4">

            <!-- MATERIAL NAME -->

            <div class="col-md-6">

                <label class="form-label">

                    Material Name

                </label>

                <input
                    type="text"
                    id="material_name"
                    class="form-control"
                    disabled
                >

            </div>

            <!-- SIZE -->

            <div class="col-md-6">

                <label class="form-label">

                    Size

                </label>

                <input
                    type="text"
                    id="material_size"
                    class="form-control"
                    disabled
                >

            </div>

        </div>

        <!-- ROW 3 -->

        <div class="row mb-4">

            <!-- QUANTITY -->

            <div class="col-md-4">

                <label class="form-label">

                    Quantity

                </label>

                <input
                    type="number"
                    step="0.01"
                    name="quantity"
                    class="form-control"
                    required
                >

            </div>

            <!-- UNIT -->

            <div class="col-md-4">

                <label class="form-label">

                    Unit

                </label>

                <input
                    type="text"
                    id="material_unit"
                    class="form-control"
                    disabled
                >

            </div>

        </div>

        <!-- BUTTON -->

        <button
            type="submit"
            class="btn btn-primary"
        >

            Save Movement

        </button>

    </form>

</div>

<!-- AUTO FILL SCRIPT -->

<script>

    const materialInput =
        document.getElementById(
            'material_code'
        );

    const materialOptions =
        document.querySelectorAll(
            '#material_list option'
        );

    materialInput.addEventListener(
        'input',
        function () {

            const selectedValue =
                this.value;

            let found = false;

            materialOptions.forEach(
                function(option) {

                    if (
                        option.value ===
                        selectedValue
                    ) {

                        document.getElementById(
                            'material_name'
                        ).value =
                            option.dataset.name;

                        document.getElementById(
                            'material_size'
                        ).value =
                            option.dataset.size;

                        document.getElementById(
                            'material_unit'
                        ).value =
                            option.dataset.unit;

                        found = true;

                    }

                }
            );

            if (!found) {

                document.getElementById(
                    'material_name'
                ).value = '';

                document.getElementById(
                    'material_size'
                ).value = '';

                document.getElementById(
                    'material_unit'
                ).value = '';

            }

        }
    );

</script>

{% endblock %}
