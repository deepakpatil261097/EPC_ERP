<!DOCTYPE html>
<html>

<head>

    <title>
        EPC ERP
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {

            background-color: #f4f9ff;
            font-family: Arial, sans-serif;
        }

        .main-navbar {

            background: linear-gradient(
                90deg,
                #38bdf8,
                #0ea5e9
            );

            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            color: white;
        }

        .card {

            border: none;
            border-radius: 15px;
            background-color: white;
        }

        .btn-primary {

            background-color: #0ea5e9;
            border: none;
        }

        .btn-primary:hover {

            background-color: #0284c7;
        }

        .btn-secondary {

            background-color: white;
            color: #0ea5e9;
            border: none;
            font-weight: 600;
        }

        .btn-secondary:hover {

            background-color: #e0f2fe;
            color: #0284c7;
        }

        .table-dark {

            background-color: #0ea5e9;
        }

        .badge-in {

            background-color: #22c55e;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .badge-out {

            background-color: #ef4444;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .readonly-box {

            background-color: #eef8ff;
        }

        input:focus,
        select:focus {

            border-color: #38bdf8 !important;

            box-shadow:
            0 0 5px #7dd3fc !important;
        }

    </style>

</head>

<body>

<div class="container mt-4">

    <div class="main-navbar d-flex justify-content-between align-items-center shadow">

        <h3>
            EPC ERP
        </h3>

        <div>

            <a
                href="/home/"
                class="btn btn-secondary"
            >
                Home
            </a>

            <a
                href="/materials/"
                class="btn btn-secondary"
            >
                Materials
            </a>

            <a
                href="/transactions/"
                class="btn btn-secondary"
            >
                Transactions
            </a>

            <a
                href="/projects/"
                class="btn btn-secondary"
            >
                Projects
            </a>

            <a
                href="/summary/"
                class="btn btn-secondary"
            >
                Summary
            </a>

        </div>

    </div>

    {% block content %}

    {% endblock %}

</div>

</body>

</html>
