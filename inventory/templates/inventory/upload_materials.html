{% extends 'inventory/base.html' %}

{% block content %}

<div class="card shadow-sm p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h3>
            Upload Materials Excel
        </h3>

        <a
            href="/materials/"
            class="btn btn-secondary"
        >
            Back
        </a>

    </div>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        <div class="mb-4">

            <label class="form-label">

                Select Excel File

            </label>

            <input
                type="file"
                name="excel_file"
                class="form-control"
                accept=".xlsx"
                required
            >

        </div>

        <button
            type="submit"
            class="btn btn-primary"
        >

            Upload Excel

        </button>

    </form>

    <hr>

    <h5>
        Excel Format
    </h5>

    <div class="table-responsive">

        <table class="table table-bordered">

            <thead class="table-dark">

                <tr>

                    <th>
                        material_code
                    </th>

                    <th>
                        material_name
                    </th>

                    <th>
                        category
                    </th>

                    <th>
                        size
                    </th>

                    <th>
                        unit
                    </th>

                    <th>
                        min_stock
                    </th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <td>
                        M-001
                    </td>

                    <td>
                        Pipe SS316
                    </td>

                    <td>
                        Pipe
                    </td>

                    <td>
                        2"
                    </td>

                    <td>
                        Nos
                    </td>

                    <td>
                        10
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
