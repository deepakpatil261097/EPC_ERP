{% extends 'inventory/base.html' %}

{% block content %}

<div class="card shadow-sm p-4">

    <h3 class="mb-4">
        Add Project
    </h3>

    <form method="POST">

        {% csrf_token %}

        <div class="row g-4">

            <div class="col-md-4">

                <label class="form-label">

                    Project Code

                </label>

                <input
                    type="text"
                    name="project_code"
                    class="form-control"
                    required
                >

            </div>

            <div class="col-md-4">

                <label class="form-label">

                    Project Name

                </label>

                <input
                    type="text"
                    name="project_name"
                    class="form-control"
                    required
                >

            </div>

            <div class="col-md-4">

                <label class="form-label">

                    Location

                </label>

                <input
                    type="text"
                    name="location"
                    class="form-control"
                    required
                >

            </div>

        </div>

        <br>

        <button
            type="submit"
            class="btn btn-primary"
        >

            Save Project

        </button>

    </form>

</div>

{% endblock %}
