{% extends 'inventory/base.html' %}

{% block content %}

<!-- PAGE HEADER -->

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>

            Add Employee

        </h2>

        <p class="text-muted mb-0">

            Create new employee
            records

        </p>

    </div>

</div>

<!-- FORM -->

<div class="erp-card">

    <form method="POST">

        {% csrf_token %}

        <div class="row g-4">

            <!-- EMPLOYEE CODE -->

            <div class="col-md-3">

                <label class="form-label">

                    Employee Code

                </label>

                <input
                    type="text"
                    name="employee_code"
                    class="form-control"
                    required
                >

            </div>

            <!-- FIRST NAME -->

            <div class="col-md-3">

                <label class="form-label">

                    First Name

                </label>

                <input
                    type="text"
                    name="first_name"
                    class="form-control"
                    required
                >

            </div>

            <!-- LAST NAME -->

            <div class="col-md-3">

                <label class="form-label">

                    Last Name

                </label>

                <input
                    type="text"
                    name="last_name"
                    class="form-control"
                >

            </div>

            <!-- OFFICIAL EMAIL -->

            <div class="col-md-3">

                <label class="form-label">

                    Official Email

                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                >

            </div>

            <!-- PERSONAL EMAIL -->

            <div class="col-md-3">

                <label class="form-label">

                    Personal Email

                </label>

                <input
                    type="email"
                    name="personal_email"
                    class="form-control"
                >

            </div>

            <!-- OFFICIAL MOBILE -->

            <div class="col-md-3">

                <label class="form-label">

                    Official Mobile

                </label>

                <input
                    type="text"
                    name="mobile_no"
                    class="form-control"
                >

            </div>

            <!-- PERSONAL MOBILE -->

            <div class="col-md-3">

                <label class="form-label">

                    Personal Mobile

                </label>

                <input
                    type="text"
                    name="personal_mobile"
                    class="form-control"
                >

            </div>

            <!-- EMPLOYEE TYPE -->

            <div class="col-md-3">

                <label class="form-label">

                    Employee Type

                </label>

                <select
                    name="employee_type"
                    class="form-select"
                >

                    <option value="">

                        Select

                    </option>

                    <option value="Permanent">

                        Permanent

                    </option>

                    <option value="Contract">

                        Contract

                    </option>

                    <option value="Trainee">

                        Trainee

                    </option>

                </select>

            </div>

            <!-- DEPARTMENT -->

            <div class="col-md-3">

                <label class="form-label">

                    Department

                </label>

                <select
                    name="department"
                    class="form-select"
                    required
                >

                    <option value="">

                        Select

                    </option>

                    {% for department in departments %}

                    <option value="{{ department.id }}">

                        {{ department.department_name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <!-- DESIGNATION -->

            <div class="col-md-3">

                <label class="form-label">

                    Designation

                </label>

                <select
                    name="designation"
                    class="form-select"
                    required
                >

                    <option value="">

                        Select

                    </option>

                    {% for designation in designations %}

                    <option value="{{ designation.id }}">

                        {{ designation.designation_name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <!-- JOINING DATE -->

            <div class="col-md-3">

                <label class="form-label">

                    Joining Date

                </label>

                <input
                    type="date"
                    name="joining_date"
                    class="form-control"
                >

            </div>

            <!-- CTC -->

            <div class="col-md-3">

                <label class="form-label">

                    CTC

                </label>

                <input
                    type="number"
                    step="0.01"
                    name="ctc"
                    class="form-control"
                >

            </div>

            <!-- NOTICE PERIOD -->

            <div class="col-md-3">

                <label class="form-label">

                    Notice Period

                </label>

                <input
                    type="text"
                    name="notice_period"
                    class="form-control"
                    placeholder="30 Days"
                >

            </div>

            <!-- REPORTING MANAGER -->

            <div class="col-md-3">

                <label class="form-label">

                    Reporting Manager

                </label>

                <input
                    type="text"
                    name="reporting_manager"
                    class="form-control"
                >

            </div>

        </div>

        <!-- BUTTON -->

        <div class="mt-4">

            <button
                type="submit"
                class="btn btn-primary"
            >

                Save Employee

            </button>

        </div>

    </form>

</div>

{% endblock %}
